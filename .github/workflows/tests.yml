name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Offline demo must flag the stale answer
        run: STALEGUARD_MODE=offline python -m staleguard.cli examples/demo_answer.txt -k 2024-06
