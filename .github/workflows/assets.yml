name: build docs assets
# Regenerates the README screenshot and the pitch deck from the current code
# and commits them to docs/.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: assets
  cancel-in-progress: true
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - name: Screenshot the offline demo
        run: |
          STALEGUARD_MODE=offline uvicorn staleguard.server:app --port 8000 &
          sleep 4
          python scripts/screenshot.py http://localhost:8000/
      - name: Build pitch deck
        run: npm install --no-save pptxgenjs && node scripts/build_deck.js
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "docs: regenerate screenshot and pitch deck"
          git push
